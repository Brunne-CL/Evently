<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Widget Evently</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #e7e2da;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    .telefono {
      width: 390px;
      height: 780px;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.55), transparent 32%),
        linear-gradient(165deg, #efe8dc 0%, #d7cfc3 55%, #cfc6b8 100%);
      padding: 18px 18px 28px;
      color: #1f2933;
    }
    .hora {
      margin: 28px 0 22px;
      text-align: center;
      font-size: 68px;
      font-weight: 620;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .fecha-hoy {
      margin: -8px 0 26px;
      text-align: center;
      color: #5c6b63;
      font-size: 15px;
    }
    .widget {
      background: rgba(255,255,255,0.94);
      border-radius: 28px;
      padding: 18px 18px 16px;
      box-shadow: 0 16px 40px rgba(31, 41, 51, 0.12);
    }
    .marca {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3d5c48;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: 0.16em;
    }
    .marca svg { display: block; }
    .etiqueta {
      margin: 14px 0 6px;
      color: #5c6b63;
      font-size: 13px;
      font-weight: 650;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    .dato {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 8px;
      color: #3d4a44;
      font-size: 15px;
      line-height: 1.35;
    }
    .dato strong { color: #1f2933; font-weight: 650; }
    .icono {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: #eef3ef;
      color: #3d5c48;
      display: grid;
      place-items: center;
      flex: none;
    }
  </style>
</head>
<body>
  <main class="telefono">
    <p class="hora">9:41</p>
    <p class="fecha-hoy">lunes 15 de junio</p>
    <section class="widget" aria-label="Widget del evento más próximo">
      <div class="marca">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <rect width="18" height="18" rx="5" fill="#3D5C48"/>
          <path d="M4.5 5.2h6.2M4.5 9h4.4M4.5 12.8h6.2" stroke="#F8F5F0" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        EVENTLY
      </div>
      <p class="etiqueta">Tu evento más próximo</p>
      <h1>Festival Universitario QRO 2026</h1>
      <div class="dato">
        <span class="icono" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="2.2" y="3.2" width="11.6" height="10.2" rx="2" stroke="#3D5C48" stroke-width="1.3"/>
            <path d="M2.2 6.4h11.6M5.2 2.2v2.2M10.8 2.2v2.2" stroke="#3D5C48" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        <span><strong>15 jun 2026 · 18:00</strong></span>
      </div>
      <div class="dato">
        <span class="icono" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 14s4.2-3.7 4.2-6.7A4.2 4.2 0 0 0 3.8 7.3C3.8 10.3 8 14 8 14Z" stroke="#3D5C48" stroke-width="1.3"/>
            <circle cx="8" cy="7.2" r="1.3" stroke="#3D5C48" stroke-width="1.3"/>
          </svg>
        </span>
        <span>Plaza de Armas, Centro Histórico, Querétaro</span>
      </div>
    </section>
  </main>
</body>
</html>
